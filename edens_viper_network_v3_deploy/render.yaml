services:
  - type: web
    name: edens-viper-network
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OWNER_USERNAME
        value: Eden's Viper
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: edens-viper-data
      mountPath: /var/data
      sizeGB: 1
