<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eden's Viper Network</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="overlay"><div class="login-card"><div class="sigil">V</div><h1>EDEN'S VIPER</h1><p>THE UNDERGROUND CHAT NETWORK</p><div class="tabs"><button id="loginTab" class="active">LOGIN</button><button id="registerTab">REGISTER</button></div><form id="authForm"><input id="username" maxlength="24" placeholder="Username" required autocomplete="username"><input id="password" type="password" minlength="8" placeholder="Password" required autocomplete="current-password"><select id="startRoom"><option>The Crypt</option><option>Vampirism</option><option>Goth Music</option><option>The Coven</option></select><button id="authSubmit">ENTER NETWORK</button></form><div id="authError" class="error"></div><small id="ownerWarning"></small></div></div>
<header class="topbar"><div class="brand"><b>V</b> EDEN'S VIPER <span>NETWORK · VOICE + VIDEO</span></div><div class="top-actions"><span class="online"><i></i> ONLINE</span><button id="profileBtn">PROFILE</button><button id="newRoom" class="mod-only">＋ ROOM</button><button id="logout">LOG OUT</button></div></header>
<main class="layout"><aside class="sidebar"><div class="section-title">CHAT ROOMS</div><div id="roomList"></div></aside><section class="center"><div class="room-head"><div><h2 id="roomTitle"></h2><p id="roomTopic"></p></div><div class="media-controls"><button id="micBtn" type="button" title="Turn microphone on">🎤 MIC OFF</button><button id="cameraBtn" type="button" title="Turn camera on">📹 CAMERA OFF</button><button id="leaveMediaBtn" type="button" class="quiet" title="Stop camera and microphone">STOP MEDIA</button></div></div><section id="mediaStage" class="media-stage"><div id="videoGrid" class="video-grid"></div><div id="mediaNotice" class="media-notice">Microphone and camera are off. Turn either on when you want to broadcast.</div></section><div id="messages" class="messages"></div><div id="typing" class="typing"></div><form id="messageForm" class="composer"><button type="button" id="emoji">☺</button><input id="messageInput" maxlength="1000" placeholder="Speak your mind..." autocomplete="off"><button>SEND</button></form></section><aside class="users"><div class="section-title">MEMBERS <span id="userCount">0</span></div><div id="userList"></div></aside></main>
<div id="modal" class="modal hidden"><form id="roomForm"><h3>Create a room</h3><input id="roomName" maxlength="32" placeholder="Room name" required><input id="roomTopicInput" maxlength="100" placeholder="Room topic"><div><button type="button" data-close="modal">CANCEL</button><button>CREATE</button></div></form></div>
<div id="profileModal" class="modal hidden"><form id="profileForm"><h3>Your profile</h3><textarea id="bio" maxlength="160" placeholder="Short bio"></textarea><div><button type="button" data-close="profileModal">CANCEL</button><button>SAVE</button></div></form></div>
<div id="pmModal" class="modal hidden"><div class="pm-card"><h3>Private chat with <span id="pmWith"></span></h3><div id="pmMessages" class="pm-messages"></div><form id="pmForm"><input id="pmInput" maxlength="1000" placeholder="Private message" autocomplete="off"><button>SEND</button></form><button class="closepm" data-close="pmModal">CLOSE</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
