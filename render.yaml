services:
  - type: web
    name: edens-viper-network
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_USERNAME
        value: Eden's Viper
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ROOM_KICK_MINUTES
        value: 10
      - key: MAX_UPLOAD_MB
        value: 5
    disk:
      name: edens-viper-data
      mountPath: /var/data
      sizeGB: 1
